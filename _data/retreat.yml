join:
  kicker: { ru: "Как попасть на ретрит", en: "How to join" }
  title: { ru: "Семь шагов *до Казбеги*", en: "Seven steps *to Kazbegi*" }
  lead:
    ru: "Нам очень важно, чтобы атмосфера и энергия на ретрите были светлыми для всех практикующих, поэтому с каждым новичком мы знакомимся лично и сверяем намерения. **Количество мест ограничено.**"
    en: "It matters to us that the atmosphere and energy feel light for everyone who practises, so we personally talk to every newcomer to make sure our intentions resonate. **Places are limited.**"
  steps:
    - { title: { ru: "Изучите информацию о ретрите", en: "Read about the retreat" }, text: { ru: "Этот сайт и Правила участия", en: "This site and the Rules" } }
    - { title: { ru: "Заполните заявку", en: "Fill in the application" }, text: { ru: "Анкета на сайте — 4 коротких шага", en: "The form on this site — 4 short steps" } }
    - { title: { ru: "Поговорите с командой организаторов", en: "Talk to the organising team" }, text: { ru: "Обязательно для всех новичков", en: "Required for all newcomers" } }
    - { title: { ru: "Получите подтверждение участия", en: "Get your place confirmed" }, text: { ru: "И реквизиты для оплаты", en: "Along with payment details" } }
    - { title: { ru: "Оплатите участие", en: "Make the payment" }, text: { ru: "В течение 10 дней — участие и предоплата за номер (25 % ночей). Остальное за номер — отелю на месте", en: "Within 10 days — the retreat fee and the room prepayment (25% of the nights). The rest for the room — to the hotel on site" } }
    - { title: { ru: "Получите подтверждение брони", en: "Receive your booking confirmation" }, text: { ru: "Места участника и номера в Rooms, если живёте там", en: "For your place, and your room at Rooms if you stay there" } }
    - { title: { ru: "Добро пожаловать в чат участников", en: "Welcome to the participants’ chat" }, text: { ru: "Там все новости и детали перед поездкой", en: "All the news and details before the trip" } }

