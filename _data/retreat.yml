# ----------------------------------------------------------------------------- проживание (stay.html)
rooms:
  mode: "through_us"           # through_us — номер закрепляем мы; hotel_site — человек бронирует сам на сайте отеля
  kicker: { ru: "Проживание", en: "Accommodation" }
  title: { ru: "Жить там, *где практикуем*", en: "Stay where *we practise*" }
  lead:
    ru: "Для нашей группы согласованы специальные цены на номера с завтраком — до 37 % ниже открытых цен отеля на те же даты. Номер бронируют организаторы. Предоплата — 25 % ночей номера — гарантирует вашу бронь у отеля, остальное вы платите отелю на месте."
    en: "Special rates have been agreed for our group on rooms with breakfast — up to 37% below the hotel’s public prices for the same dates. We book the room for you. A prepayment of 25% of the room’s nights guarantees your booking with the hotel, and you pay the rest to the hotel on site."
  options:                     # где можно жить — и на ретрите, и на интенсиве
    - title: { ru: "Rooms Kazbegi — по групповому тарифу ретрита", en: "Rooms Kazbegi — at the retreat group rate" }
      text: { ru: "Укажите в анкете категорию номера и даты — организаторы забронируют номер по групповому тарифу.", en: "Give the room category and dates in the application, and the organisers will book the room at the group rate." }
    - title: { ru: "Rooms Kazbegi — бронирование напрямую", en: "Rooms Kazbegi — direct booking" }
      text: { ru: "Бронь напрямую на сайте отеля — по его обычным ценам.", en: "Book directly on the hotel’s website, at its regular rates." }
      url: "https://roomshotels.com/locations/kazbegi"
    - title: { ru: "Другое размещение рядом", en: "Other accommodation nearby" }
      text: { ru: "В гостевом доме или отеле рядом — и приходить на практики и общие активности.", en: "At a guesthouse or hotel nearby — and come for the sessions and shared activities." }
  currency: "$"
  vat: 18                      # НДС, % — цены с НДС сайт считает сам
  price_label: { ru: "групповой тариф, за номер за ночь", en: "group rate, per room per night" }
  categories:                  # single / double — цена за ночь для одного / двоих без НДС (пусто — «уточняется»); url — страница номера на сайте отеля
    - name: "Standard"
      type: { ru: "King или Twin", en: "King or Twin" }
      text: { ru: "Уютный номер с видом на лес или на горы.", en: "A cosy room facing the forest or the mountains." }
      url: "https://roomshotels.com/locations/kazbegi#rooms"
      photo: { src: "room-standard.webp", alt: { ru: "Номер Standard", en: "Standard room" } }
      variants:
        - { name: { ru: "King · вид на лес", en: "King · forest view" }, single: 160, double: 180 }
        - { name: { ru: "Twin · вид на лес", en: "Twin · forest view" }, single: 160, double: 180 }
        - { name: { ru: "King · вид на горы", en: "King · mountain view" }, single: 175, double: 195 }
    - name: "Executive"
      type: { ru: "для долгого проживания", en: "made for longer stays" }
      text: { ru: "Просторнее, ванная из натурального дерева с тропическим душем.", en: "More spacious, with a natural-wood bathroom and a rainfall shower." }
      url: "https://roomshotels.com/locations/kazbegi#rooms"
      photo: { src: "room-executive.webp", alt: { ru: "Номер Executive", en: "Executive room" } }
      variants:
        - { name: { ru: "King · вид на лес", en: "King · forest view" }, single: 195, double: 215 }
        - { name: { ru: "King · вид на горы", en: "King · mountain view" }, single: 205, double: 225 }
    - name: "Signature"
      type: { ru: "просторный, с ванной", en: "spacious, with a bathtub" }
      text: { ru: "Большой номер с ванной и видом с террасы.", en: "A large room with a bathtub and a terrace view." }
      url: "https://roomshotels.com/locations/kazbegi#rooms"
      photo: { src: "room-signature.webp", alt: { ru: "Номер Signature", en: "Signature room" } }
      variants:
        - { name: { ru: "King · вид на лес", en: "King · forest view" }, single: 290, double: 310 }
        - { name: { ru: "King · вид на горы", en: "King · mountain view" }, single: 305, double: 325 }
  price_note:                  # «до 37 %» = группа vs Booking «free cancel», замер 09.10.2026 (01-rooms-venue/public-vs-group-prices); Илья 25.11: брать максимум
    ru: "Цены в карточках — групповой тариф ретрита, а не цены с сайта отеля: до 37 % ниже открытых цен на те же даты. В долларах, за номер за ночь, завтрак включён: первая цифра — для одного гостя, вторая — для двоих. Официальные ночи ретрита — с {checkin} по {checkout} ({nights} ночей), дополнительные ночи до и после — по тем же ценам."
    en: "The prices on the cards are the retreat group rate, not the hotel website’s prices — up to 37% below the public prices for the same dates. In US dollars, per room per night, breakfast included: the first figure is for one guest, the second for two. The official retreat nights are {checkin} to {checkout} ({nights} nights); extra nights before and after are at the same rates."
  payment:                     # как платить за проживание — заметным блоком
    ru: "Проживание оплачивается в два этапа. Предоплата — 25 % ночей вашего номера (округляем вверх: при 9 ночах это 3 ночи) — вносится нам вместе с оплатой участия, в течение 10 дней после подтверждения заявки. Мы переводим её отелю, и она гарантирует вашу бронь в групповом блоке. Остальное вы оплачиваете отелю на месте. Если вы отменяете номер до 11.05.2027 включительно, предоплата возвращается полностью; с 12.05.2027 она уже у отеля и не возвращается. Цены — за номер за ночь, завтрак включён, плюс НДС 18%. Чтобы мы забронировали номер, укажите в анкете категорию и даты."
    en: "Your stay is paid in two parts. A prepayment of 25% of your room’s nights (rounded up: for 9 nights that is 3 nights) is paid to us together with the retreat fee, within 10 days of your application being confirmed. We pass it to the hotel, and it guarantees your booking in the group block. You pay the rest to the hotel on site. If you cancel the room by 11 May 2027 inclusive, the prepayment is refunded in full; from 12 May 2027 it is already with the hotel and is not refunded. Prices are per room per night, breakfast included, plus 18% VAT. To have us book a room for you, give the category and dates in the application."
  steps:                       # только для through_us: как идёт бронь
    - { ru: "В анкете укажите, что хотите жить в Rooms, категорию номера и даты", en: "In the application, say you’d like to stay at Rooms and give the room category and dates" }
    - { ru: "Организаторы бронируют номер по групповому тарифу", en: "The organisers book the room at the group rate" }
    - { ru: "Предоплата 25 % ночей — нам, вместе с участием; остальное — отелю на месте. Плюс НДС 18%", en: "A 25% prepayment of the nights — to us, with the retreat fee; the rest — to the hotel on site. Plus 18% VAT" }
  info:                        # пустой text — «уточняется»
    - title: { ru: "Отмена и возврат проживания", en: "Room cancellation and refunds" }
      text: { ru: "До 11.05.2027 включительно номер можно отменить, и предоплата возвращается полностью. С 12.05.2027 предоплата уже у отеля: номер можно отменить только заменой имени — переписав его на другого гостя, иначе предоплаченные ночи не возвращаются. При неявке или поздней отмене полную стоимость проживания по счёту отеля оплачиваете вы. Если сосед по номеру не приедет, номер остаётся за вами.", en: "Until 11 May 2027 inclusive, the room can be cancelled and the prepayment is refunded in full. From 12 May 2027 the prepayment is with the hotel: the room can only be cancelled by replacing the guest’s name — passing it to another guest — otherwise the prepaid nights are not refunded. For a no-show or a late cancellation, you pay the full cost of the stay on the hotel’s bill. If your roommate doesn’t come, the room stays yours." }   # Илья 25.11 + письмо Ани 20.11 + confirm_room; ответа Ани на 25 % ещё нет
    - title: { ru: "Доп. кровати и дети", en: "Extra beds and children" }
      text: { ru: "Дополнительная кровать — 10 $ за ночь плюс НДС 18%, отметьте это в анкете. Дети могут приехать с родителями, но на практиках не присутствуют; детской программы и присмотра организаторы не организуют.", en: "An extra bed is $10 per night plus 18% VAT — mark it in the application. Children may come with their parents but do not attend the sessions; the organisers do not provide a children’s programme or childcare." }   # 10 $ = цена 2026 (hotel-baseline-2026), на 2027 у отеля не спрашивали
    - title: { ru: "Питание", en: "Meals" }
      text: { ru: "Завтрак входит в проживание. Обед и ужин — в ресторане отеля или в кафе посёлка.", en: "Breakfast is included. Lunch and dinner at the hotel restaurant or in the village cafés." }
  link: { url: "https://drive.google.com/drive/folders/177Qdydk48egib21E2DL-T3Oa7qNrJIGa?usp=sharing", label: { ru: "Все фото номеров", en: "All room photos" } }
  hotel_site: { url: "", promo: "" }   # только для режима hotel_site: ссылка на бронирование и текст про промокод

