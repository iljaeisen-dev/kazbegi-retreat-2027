    - icon: car
      title: { ru: "Маршрутка или такси из Тбилиси", en: "Minibus or taxi from Tbilisi" }
      text: { ru: "Маршрутки в Степанцминду уходят с автостанции Дидубе в течение дня. Можно договориться о совместном трансфере с другими участниками в чате.", en: "Minibuses to Stepantsminda leave Didube bus station throughout the day. You can also share a transfer with other participants via the chat." }
