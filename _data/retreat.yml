  stay_hint: { ru: "Проживание в Rooms Kazbegi — от {rooms_from} $ за номер за ночь, плюс НДС 18%. Оплата — отелю при заезде.", en: "Rooms at Rooms Kazbegi — from ${rooms_from} per room per night, plus 18% VAT, paid to the hotel at check-in." }
  intensive:                   # карточка интенсива рядом с ценой ретрита
    tag: { ru: "Rooms Kazbegi · {intensive_dates}", en: "Rooms Kazbegi · {intensive_dates}" }
    title: { ru: "Интенсив", en: "Intensive" }
    prices:                    # одна или несколько цен; price пусто — «уточняется»
      - { label: { ru: "Участникам ретрита", en: "Retreat participants" }, price: 400 }
      - { label: { ru: "Только интенсив", en: "Intensive only" }, price: 550 }
    list:
      - { ru: "Три дня углублённой практики с Мастером: 20 июля — 4 ч, 21 июля — 6 ч, 22 июля — 5 ч", en: "Three days of deeper practice with the Master: 20 July — 4 h, 21 July — 6 h, 22 July — 5 h" }
      - { ru: "Можно приехать только на интенсив", en: "You can come for the intensive only" }
      - { ru: "Меньше 15 участников — интенсив не проводим и возвращаем оплату целиком", en: "Fewer than 15 participants — the intensive doesn’t run and payments are refunded in full" }
      - { ru: "Проживание — Rooms Kazbegi по групповому тарифу, Rooms Kazbegi напрямую или другое размещение рядом", en: "Accommodation — Rooms Kazbegi at the group rate, Rooms Kazbegi booked directly, or other accommodation nearby" }
  private: { ru: "100 € / час или 50 € / 30 минут", en: "€100 per hour or €50 per 30 minutes" }
  refund_title: { ru: "Отмена и возврат", en: "Cancellation and refunds" }
  refund:                      # один текст — на главной и в FAQ
    ru: |
      Если вы оплатили участие, но не можете поехать:

      - более чем за 3 месяца до начала — возвращается 100%;
      - за 2–3 месяца — 50%;
      - менее чем за 2 месяца — оплата не возвращается.

      Если до 1 марта 2027 года наберётся недостаточно участников, ретрит отменяется и все деньги возвращаются полностью.

      Если Мастер или кто-то из организаторов не сможет провести ретрит, а также при форс-мажоре стоимость возвращается за вычетом прямых расходов (аренда зала, дорога Мастера и т. д.).

      Организация ретрита некоммерческая: средства идут на логистику, проживание и поддержку Мастера, аренду зала и оборудования.
    en: |
      If you have paid but can’t come:

      - more than 3 months before the start — 100% refund;
      - 2–3 months before — 50% refund;
      - less than 2 months before — no refund.

      If there are not enough participants by 1 March 2027, the retreat is cancelled and all payments are refunded in full.

      If the Master or one of the organisers is unable to hold the retreat, or in case of force majeure, the fee is refunded minus direct costs (venue rental, the Master’s travel, etc.).

      The retreat is run on a non-profit basis: the money covers logistics, the Master’s stay and support, and the rental of the hall and equipment.

# ----------------------------------------------------------------------------- как попасть (join.html) и «что дальше» после анкеты
join:
  kicker: { ru: "Как попасть на ретрит", en: "How to join" }
  title: { ru: "Семь шагов *до Казбеги*", en: "Seven steps *to Kazbegi*" }
  lead:
    ru: "Нам очень важно, чтобы атмосфера и энергия на ретрите были светлыми для всех практикующих, поэтому с каждым новичком мы знакомимся лично и сверяем намерения. **Количество мест ограничено.**"
    en: "It matters to us that the atmosphere and energy feel light for everyone who practises, so we personally talk to every newcomer to make sure our intentions resonate. **Places are limited.**"
  steps:
    - { title: { ru: "Изучите информацию о ретрите", en: "Read about the retreat" }, text: { ru: "Этот сайт и Правила участия", en: "This site and the Rules" } }
    - { title: { ru: "Заполните заявку", en: "Fill in the application" }, text: { ru: "Анкета на сайте — 4 коротких шага", en: "The form on this site — 4 short steps" } }
    - { title: { ru: "Поговорите с командой организаторов", en: "Talk to the organising team" }, text: { ru: "Обязательно для всех новичков", en: "Required for all newcomers" } }
    - { title: { ru: "Получите подтверждение участия", en: "Get your place confirmed" }, text: { ru: "И реквизиты для оплаты", en: "Along with payment details" } }
    - { title: { ru: "Оплатите участие", en: "Make the payment" }, text: { ru: "В течение 7 дней. Проживание — напрямую отелю при заезде", en: "Within 7 days. Accommodation is paid to the hotel at check-in" } }
    - { title: { ru: "Получите подтверждение брони", en: "Receive your booking confirmation" }, text: { ru: "Места участника и номера в Rooms, если живёте там", en: "For your place, and your room at Rooms if you stay there" } }
    - { title: { ru: "Добро пожаловать в чат участников", en: "Welcome to the participants’ chat" }, text: { ru: "Там все новости и детали перед поездкой", en: "All the news and details before the trip" } }

# ----------------------------------------------------------------------------- как добраться (travel.html)
travel:
