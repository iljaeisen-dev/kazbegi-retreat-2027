# ----------------------------------------------------------------------------- что включено: карточки из каталога practices
included:
  kicker: { ru: "Что включено", en: "What’s included" }
  title: { ru: "Всё для *глубокого* погружения", en: "Everything for a *deep* immersion" }
  lead:
    ru: "Практики с Мастером, поддержка наставников, йога, вечера у огня и одно общее барбекю — чтобы каждый день был наполнен практикой, горами и живым общением."
    en: "Sessions with the Master, mentors’ support, yoga, evenings by the fire and one shared barbecue — so every day is filled with practice, mountains and genuine connection."
  cards: [practice, mentors, yoga, massage, fire, bbq]   # какие карточки показать и в каком порядке

practices:                     # каталог карточек; lead — кто ведёт (раскрывается по нажатию)
  practice:
    title: { ru: "Групповые практики", en: "Group practice" }
    text: { ru: "С Мастером и его учениками — утром и вечером, каждый день.", en: "With the Master and his students — morning and evening, every day." }
    photo: { src: "card-practice.webp", pos: "50% 28%", alt: { ru: "Мастер ведёт занятие", en: "The Master leading a session" } }
  mentors:
    title: { ru: "Наставничество", en: "Mentorship" }
    text: { ru: "1–2 встречи с наставником перед началом и поддержка на самом ретрите.", en: "1–2 meetings with a mentor before the start and support during the retreat." }
    photo: { src: "card-mentors-portugal.webp", pos: "50% 40%", alt: { ru: "Беседа с наставником", en: "A conversation with a mentor" } }
  yoga:
    title: { ru: "Йога", en: "Yoga" }
    tag: { ru: "включено", en: "included" }
    text: { ru: "Утренняя практика без погони за формой и достижениями.", en: "Morning practice with no chasing of form or achievement." }
    more:
      ru: "Пространство, где можно перестать бороться с собой и расслабить контроль. Тело становится надёжной опорой для более глубокого внутреннего опыта."
      en: "A space to stop fighting yourself and loosen control. The body becomes a steady support for deeper inner experience."
    lead:
      name: { ru: "Дарья", en: "Daria" }
      about:
        ru: "Приветствую участников. Йога, которую я преподаю, может быть также интересна любителям воркаута. Течение практики будет зависеть от общего состояния группы."
        en: "Welcome, everyone. The yoga I teach may also appeal to those who enjoy workouts. How the practice unfolds will depend on the overall state of the group."
    photo: { src: "card-yoga-daria.webp", pos: "50% 45%", alt: { ru: "Йога с Дарьей", en: "Yoga with Daria" } }
  massage:
    title: { ru: "Массаж", en: "Massage" }
    tag: { ru: "за отдельную плату", en: "paid separately" }
    text: { ru: "Приём у специалиста по массажу и правкам тела — в течение всего ретрита, по записи. За отдельную плату.", en: "Sessions with a massage and body-work specialist throughout the retreat, by appointment. Paid separately." }
    lead:
      name: { ru: "Павел", en: "Pavel" }
      about:
        ru: "Павел Козлов — сертифицированный инструктор йоги, натуропрактик, целитель, автор и ведущий курсов по оздоровлению тела, ведущий практик по гонг-медитациям, проводник по гвоздестоянию. Направления приёма: работа с внутренними органами (правка живота, висцеральный массаж); работа с мышцами, тканями, связками, сухожилиями и внутренними цепями (вакуумный массаж, суставная правка всего тела, ударно-вибрационная техника «Лад тела» петлями-нагайками); энергетические практики и очищение каналов — целение в тишине; классический расслабляющий массаж всего тела и зонально."
        en: "Pavel Kozlov is a certified yoga instructor, naturopath and healer, author and teacher of body-health courses, a lead practitioner of gong meditations and a guide in nail-standing (gvozdestoyanie). Sessions cover: work with the internal organs (abdominal realignment, visceral massage); work with muscles, tissues, ligaments, tendons and inner chains (vacuum massage, full-body joint realignment, the percussive-vibration “Body Tune” technique with whip-loops); energy practices and channel cleansing — healing in silence; classic relaxing full-body and targeted massage."
    photo: { src: "card-massage-pavel.webp", alt: { ru: "Павел Козлов", en: "Pavel Kozlov" } }
  fire:
    title: { ru: "Вечерние костры", en: "Evening bonfires" }
    text: { ru: "Посиделки у огня с рефлексией, музыкой и творчеством.", en: "Gatherings by the fire with reflection, music and creativity." }
    photo: { src: "card-fire.webp", alt: { ru: "Вечер у костра", en: "An evening by the fire" } }
  bbq:
    title: { ru: "Барбекю", en: "Barbecue" }
    tag: { ru: "входит в стоимость", en: "included" }
    text: { ru: "Один совместный вечер-барбекю на территории отеля. Дата уточняется.", en: "One shared barbecue evening on the hotel grounds. Date to be confirmed." }
    photo: { src: "card-bbq.webp", pos: "50% 80%", alt: { ru: "Барбекю на лугу под горами", en: "A barbecue on a meadow beneath the mountains" } }

