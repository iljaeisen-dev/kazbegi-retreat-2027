pricing:
  kicker: { ru: "Стоимость", en: "Pricing" }
  title: { ru: "Стоимость *участия*", en: "The *price*" }
  lead: { ru: "Участие — одной суммой, цена зависит от даты оплаты. Реквизиты пришлём после подтверждения заявки. Проживание — отдельно: предоплата 25 % ночей вместе с участием, остальное — отелю на месте.", en: "One fee for the retreat; the price depends on when you pay. Payment details are sent once your application is confirmed. Accommodation is separate: a 25% prepayment of the nights with the retreat fee, the rest to the hotel on site." }
  tag: { ru: "Rooms Kazbegi · {dates_short}", en: "Rooms Kazbegi · {dates_short}" }
  plan_title: { ru: "Участие в ретрите", en: "Retreat fee" }
  currency: "€"
  parts:                       # если ступеней нет: одна строка — одна цена, несколько — сумма частей
    - { name: { ru: "Участие в ретрите", en: "Retreat fee" }, price: 1000 }
  tiers:                       # цена по дате ОПЛАТЫ, текущая ступень выбирается сама: until — «при оплате до», from — «с» (последняя)
    - { until: "2026-12-31", price: 800 }
    - { until: "2027-03-31", price: 900 }
    - { from: "2027-04-01", price: 1000 }
  after_last: ""               # что после последней ступени с until: "" — её цена, "closed" — приём закрыт
  provisional: false           # true — рядом с ценой пометка «предварительно»
  tiers_note: { ru: "Цена определяется датой оплаты, а не датой заявки.", en: "The price depends on the date you pay, not the date you apply." }
  includes_title: { ru: "Входит в стоимость", en: "Included" }
  includes:                    # под ценой — что входит
    - { ru: "Групповые практики с Мастером — утром и вечером", en: "Group sessions with the Master — morning and evening" }
    - { ru: "Наставничество", en: "Mentorship" }
    - { ru: "Йога", en: "Yoga" }
    - { ru: "Вечерние костры", en: "Evening bonfires" }
    - { ru: "Одно совместное барбекю", en: "One shared barbecue" }
  list:
    - { ru: "Оплата в течение 10 дней после подтверждения заявки: USDT (сеть TRON или TON) или USDC (сеть Ethereum) — основной способ, без доплаты; банковский перевод в евро — без доплаты; в долларах, рублях, другой валюте и через PayPal — с доплатой 10 % от суммы в евро.", en: "Payment within 10 days of your application being confirmed: USDT (TRON or TON network) or USDC (Ethereum network) — the main way, no surcharge; bank transfer in euros — no surcharge; in US dollars, roubles, another currency or via PayPal — with a 10% surcharge on the euro amount." }
    - { ru: "Планируется только вживую, без онлайн-трансляции", en: "Planned in person only, no live stream" }
  fine: { ru: "Проживание — отдельно: предоплата 25 % ночей через нас, остальное — отелю на месте. Массаж и дополнительные активности — за отдельную плату.", en: "Accommodation is separate: a 25% prepayment of the nights through us, the rest to the hotel on site. Massage and optional activities are paid separately." }
  stay_hint: { ru: "Проживание в Rooms Kazbegi — от {rooms_from} $ за номер за ночь, плюс НДС 18%. Предоплата 25 % ночей — через нас, остальное — отелю на месте.", en: "Rooms at Rooms Kazbegi — from ${rooms_from} per room per night, plus 18% VAT. A 25% prepayment of the nights goes through us, the rest is paid to the hotel on site." }
  intensive:                   # карточка интенсива рядом с ценой ретрита
    tag: { ru: "Rooms Kazbegi · {intensive_dates}", en: "Rooms Kazbegi · {intensive_dates}" }
    title: { ru: "Интенсив", en: "Intensive" }
    prices:                    # одна или несколько цен; price пусто — «уточняется»
      - { label: { ru: "С ретритом, интенсив забронирован до 30.04.2027 (сразу или добавлен позже)", en: "With the retreat, intensive booked by 30 April 2027 (right away or added later)" }, price: 400 }
      - { label: { ru: "После 30.04.2027 или только интенсив", en: "After 30 April 2027, or the intensive only" }, price: 550 }
    list:
      - { ru: "Три дня углублённой практики с Мастером: 20 июля — 4 ч, 21 июля — 6 ч, 22 июля — 5 ч", en: "Three days of deeper practice with the Master: 20 July — 4 h, 21 July — 6 h, 22 July — 5 h" }
      - { ru: "Можно приехать только на интенсив", en: "You can come for the intensive only" }
      - { ru: "Меньше 15 участников — интенсив не проводим и возвращаем оплату целиком", en: "Fewer than 15 participants — the intensive doesn’t run and payments are refunded in full" }
      - { ru: "Проживание — Rooms Kazbegi по групповому тарифу, Rooms Kazbegi напрямую или другое размещение рядом", en: "Accommodation — Rooms Kazbegi at the group rate, Rooms Kazbegi booked directly, or other accommodation nearby" }
  private: { ru: "50 € за 30 минут · одна сессия на человека", en: "€50 per 30 minutes · one session per person" }
  refund_title: { ru: "Отмена и возврат", en: "Cancellation and refunds" }
  refund:                      # один текст — на главной и в FAQ
    ru: |
      Если вы оплатили участие, но не можете поехать:

      Участие в ретрите:
      - до 11.04.2027 включительно — возвращается 100%;
      - с 12.04.2027 по 11.05.2027 — 50%;
      - с 12.05.2027 — оплата не возвращается.

      Интенсив:
      - до 19.04.2027 включительно — возвращается 100%;
      - с 20.04.2027 по 19.05.2027 — 50%;
      - с 20.05.2027 — оплата не возвращается.

      Срок считается по дню, когда мы получили ваше уведомление. Комиссию банка или сети за возврат оплачиваете вы: она вычитается из суммы возврата.

      Возвращаем ровно ту сумму, что пришла к нам, в той же валюте, в течение 14 дней после получения вашего уведомления.

      Проживание: предоплата за номер (25 % ночей) при отмене до 11.05.2027 включительно возвращается полностью. С 12.05.2027 она уже у отеля и не возвращается — номер можно отменить только заменой имени гостя; при неявке или поздней отмене полную стоимость проживания по счёту отеля оплачиваете вы.

      Если до 1 марта 2027 года наберётся недостаточно участников, ретрит отменяется и все деньги возвращаются полностью.

      Если Мастер или кто-то из организаторов не сможет провести ретрит, а также при форс-мажоре стоимость возвращается за вычетом прямых расходов (аренда зала, дорога Мастера и т. д.).

      Организация ретрита некоммерческая: средства идут на логистику, проживание и поддержку Мастера, аренду зала и оборудования.
    en: |
      If you have paid but can’t come:

      Retreat participation:
      - until 11 April 2027 inclusive — 100% refund;
      - 12 April to 11 May 2027 — 50% refund;
      - from 12 May 2027 — no refund.

      Intensive:
      - until 19 April 2027 inclusive — 100% refund;
      - 20 April to 19 May 2027 — 50% refund;
      - from 20 May 2027 — no refund.

      The period is counted from the day we receive your notice. The bank or network fee for the refund is paid by you and deducted from the refund.

      We refund exactly the amount we received, in the same currency, within 14 days of receiving your notice.

      Accommodation: the room prepayment (25% of the nights) is refunded in full if you cancel by 11 May 2027 inclusive. From 12 May 2027 it is with the hotel and is not refunded — the room can then only be cancelled by replacing the guest’s name; for a no-show or a late cancellation, you pay the full cost of the stay on the hotel’s bill.

      If there are not enough participants by 1 March 2027, the retreat is cancelled and all payments are refunded in full.

      If the Master or one of the organisers is unable to hold the retreat, or in case of force majeure, the fee is refunded minus direct costs (venue rental, the Master’s travel, etc.).

      The retreat is run on a non-profit basis: the money covers logistics, the Master’s stay and support, and the rental of the hall and equipment.

