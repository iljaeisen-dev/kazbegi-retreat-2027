# ----------------------------------------------------------------------------- частые вопросы (faq.html); ответы — с переносами строк, списками "- " и ссылками [текст](адрес)
faq:
  - title: { ru: "Оплата", en: "Payment" }
    items:
      - q: { ru: "Как формируется стоимость ретрита?", en: "What makes up the price?" }
        a: { ru: "Организация ретрита некоммерческая. Средства идут на логистику, проживание и поддержку Мастера, аренду зала и оборудования, прочие сопутствующие расходы.", en: "The retreat is run on a non-profit basis. The money covers logistics, the Master’s stay and support, the rental of the hall and equipment, and other related costs." }
      - q: { ru: "Как можно оплатить?", en: "How can I pay?" }
        a:
          ru: |
            **Участие:** в течение 10 дней после подтверждения заявки. Криптовалюта — USDT (сети TRON или TON) или USDC (сеть Ethereum), без доплаты; банковский перевод в евро — без доплаты; в долларах, рублях, другой валюте и через PayPal — с доплатой 10 % от суммы в евро. Реквизиты пришлём после подтверждения заявки.

            **Проживание в Rooms Kazbegi:** предоплата 25 % ночей номера — вместе с оплатой участия, она гарантирует бронь у отеля; при отмене до 11.05.2027 включительно возвращается полностью, позже — нет; остальное — отелю на месте. К цене добавляется НДС 18%.
          en: |
            **The retreat:** within 10 days of your application being confirmed. Crypto — USDT (TRON or TON network) or USDC (Ethereum network), no surcharge; bank transfer in euros — no surcharge; in US dollars, roubles, another currency or via PayPal — with a 10% surcharge on the euro amount. Payment details are sent once your application is confirmed.

            **Your room at Rooms Kazbegi:** a prepayment of 25% of the room’s nights together with the retreat fee — it guarantees your booking with the hotel; if you cancel by 11 May 2027 inclusive it is refunded in full, later it is not; the rest is paid to the hotel on site. Plus 18% VAT.
      - q: { ru: "Какие условия частных занятий с Мастером?", en: "What about private sessions with the Master?" }
        a: { ru: "Такая возможность может появиться при предварительной организации. Если занятие состоится, оно оплачивается отдельно: {private}. Тем, кто едет и на интенсив, просим записываться на дни интенсива.", en: "This may be possible if arranged in advance. If a session takes place, it is paid separately: {private}. If you are also coming to the intensive, please book on the intensive days." }
      - q: { ru: "Какие условия возврата?", en: "What is the refund policy?" }
        a: refund              # тот же текст, что в блоке «Отмена и возврат» на главной
      - q: { ru: "Сколько стоят дополнительные активности?", en: "How much do the optional activities cost?" }
        a: { ru: "Точные цены назовём перед ретритом или перед началом активности. Например, массаж — около 40 €.", en: "We’ll give exact prices before the retreat or before each activity. For example, a massage is about €40." }
  - title: { ru: "Проживание", en: "Accommodation" }
    items:
      - q: { ru: "Можно приехать раньше и уехать позже?", en: "Can I arrive earlier and leave later?" }
        a: { ru: "Да. Дополнительные ночи до и после ретрита — по тому же групповому тарифу.", en: "Yes. Extra nights before and after the retreat are at the same group rate." }
      - q: { ru: "Во сколько заезд и выезд?", en: "What are the check-in and check-out times?" }
        a:
          ru: |
            Официальные ночи ретрита — с {checkin} по {checkout} ({nights} ночей): так утро {start} начнётся с практики с Мастером. После интенсива выезд — {intensive_checkout}.

            Время заезда и выезда, ранний заезд и поздний выезд уточним после договора с отелем.
          en: |
            The official retreat nights are {checkin} to {checkout} ({nights} nights), so the morning of {start} starts with practice. After the intensive, check-out is on {intensive_checkout}.

            Check-in and check-out times, early check-in and late check-out will be confirmed once the hotel contract is signed.
      - q: { ru: "Как забронировать номер или изменить бронь?", en: "How do I book a room or change a booking?" }
        a: { ru: "Через организаторов: укажите в анкете, что хотите жить в Rooms, категорию номера и даты — организаторы забронируют номер по групповому тарифу. Предоплата 25 % ночей — вместе с оплатой участия, остальное — отелю на месте. Изменения брони — также через организаторов.", en: "Through the organisers: in the application, say you’d like to stay at Rooms and give the room category and dates — the organisers will book the room at the group rate. A 25% prepayment of the nights is paid with the retreat fee, the rest to the hotel on site. Changes to the booking also go through the organisers." }
      - q: { ru: "Где посмотреть все фото номеров?", en: "Where can I see all the room photos?" }
        a: { ru: "Полная подборка — [в этой папке](https://drive.google.com/drive/folders/177Qdydk48egib21E2DL-T3Oa7qNrJIGa?usp=sharing), а описания номеров — на [сайте отеля](https://roomshotels.com/locations/kazbegi).", en: "The full set is [in this folder](https://drive.google.com/drive/folders/177Qdydk48egib21E2DL-T3Oa7qNrJIGa?usp=sharing), and the room descriptions are on the [hotel website](https://roomshotels.com/locations/kazbegi)." }
      - q: { ru: "Сколько стоит проживание?", en: "How much is accommodation?" }
        a: { ru: "От {rooms_from} $ за номер за ночь плюс НДС 18%, завтрак включён. Все цены — на странице [«Проживание»](stay.html). Предоплата 25 % ночей — через нас, остальное — отелю на месте.", en: "From ${rooms_from} per room per night plus 18% VAT, breakfast included. All prices are on the [Accommodation](stay.html) page. A 25% prepayment of the nights goes through us, the rest is paid to the hotel on site." }
      - q: { ru: "Завтрак включён?", en: "Is breakfast included?" }
        a: { ru: "Да, завтрак включён в стоимость проживания. Буфет работает до 11:00, но и после этого можно спокойно доесть.", en: "Yes, breakfast is included in the room rate. The buffet runs until 11:00, but you can take your time finishing after that." }
      - q: { ru: "А обед и ужин?", en: "What about lunch and dinner?" }
        a: { ru: "В ресторане отеля Kazbegi Kitchen или в одном из ресторанов и кафе посёлка.", en: "At the hotel’s Kazbegi Kitchen restaurant or at one of the village restaurants and cafés." }
      - q: { ru: "Что если мне не подходят условия проживания в отеле?", en: "What if the hotel doesn’t suit me?" }
        a: { ru: "Можно забронировать номер в Rooms самостоятельно на сайте отеля или выбрать гостевой дом или отель рядом — и приходить на практики и общие активности.", en: "You can book a room at Rooms yourself on the hotel website, or pick a guesthouse or hotel nearby — and come for the sessions and shared activities." }
      - q: { ru: "Можно приехать с детьми?", en: "Can I bring children?" }
        a: { ru: "Да — отметьте это в анкете. На практиках дети не присутствуют; детской программы и присмотра (няни) организаторы не организуют. Дополнительная кровать — 10 $ за ночь плюс НДС 18%.", en: "Yes — mention it in the application. Children do not attend the sessions, and the organisers do not provide childcare or a children’s programme. An extra bed is $10 per night plus 18% VAT." }
  - title: { ru: "Организация", en: "Organisation" }
    items:
      - q: { ru: "Будет ли онлайн-трансляция?", en: "Will there be a live stream?" }
        a: { ru: "Нет: ретрит и интенсив планируются только вживую. Присутствие Мастера, общее поле и ритм практики — в зале, а не на экране.", en: "No: the retreat and the intensive are planned in person only. The Master’s presence, the shared field and the rhythm of practice happen in the hall, not on a screen." }
      - q: { ru: "Можно приехать только на интенсив?", en: "Can I come for the intensive only?" }
        a: { ru: "Да. Интенсив — {intensive_dates}: 400 €, если вы едете и на ретрит, и на интенсив и бронируете интенсив до 30.04.2027 включительно — сразу в заявке или добавив его к своей заявке позже; 550 € — после 30.04.2027 или если вы едете только на интенсив. Если запишется меньше 15 человек, интенсив не состоится, и мы вернём оплату целиком.", en: "Yes. The intensive runs {intensive_dates}: €400 if you come to both the retreat and the intensive and book the intensive by 30 April 2027 inclusive — right in your application or by adding it to your application later; €550 after 30 April 2027 or if you come for the intensive only. If fewer than 15 people sign up, it won’t take place and we’ll refund the payment in full." }
      - q: { ru: "Где жить на интенсиве?", en: "Where do I stay for the intensive?" }
        a: { ru: "Как и на ретрите: Rooms Kazbegi по групповому тарифу, Rooms Kazbegi с бронированием напрямую или другое размещение рядом.", en: "As for the retreat: Rooms Kazbegi at the group rate, Rooms Kazbegi booked directly, or other accommodation nearby." }
      - q: { ru: "Почему ретрит могут отменить?", en: "Why might the retreat be cancelled?" }
        a:
          ru: |
            - Если Мастер или кто-то из организаторов не сможет его провести;
            - если до 1 марта 2027 года наберётся недостаточно участников — тогда все деньги возвращаются полностью;
            - при форс-мажоре.
          en: |
            - If the Master or one of the organisers can’t hold it;
            - if there are not enough registrations by 1 March 2027 — then all payments are refunded in full;
            - in case of force majeure.
      - q: { ru: "Что есть рядом с отелем?", en: "What is near the hotel?" }
        a: { ru: "Отель находится в посёлке Степанцминда: магазины, рестораны, аптеки.", en: "The hotel is in the village of Stepantsminda, with shops, restaurants and pharmacies." }
      - q: { ru: "Что взять с собой?", en: "What should I bring?" }
        a:
          ru: |
            - Комфортную одежду для длительной практики;
            - тёплую одежду — мы будем в горах;
            - дождевик и обувь для прогулок;
            - блокнот и ручку для заметок;
            - SPF — солнце в горах сильное;
            - купальник для бассейна и спа.
          en: |
            - Comfortable clothes for long sessions;
            - warm clothes — we’ll be in the mountains;
            - a rain jacket and walking shoes;
            - a notebook and pen;
            - sunscreen — the mountain sun is strong;
            - a swimsuit for the pool and spa.
      - q: { ru: "Какая будет погода?", en: "What will the weather be like?" }
        a: { ru: "В горах погода непредсказуема, но в среднем днём около +20 °C, ночью около +10 °C.", en: "Mountain weather is unpredictable, but on average it’s about +20 °C by day and +10 °C at night." }
      - q: { ru: "Что ещё важно знать?", en: "What else is important?" }
        a: { ru: "Самое важное — внимательно изучить этот сайт и [Правила участия в ретрите]({rules}).", en: "Most importantly, read this site and the [retreat Rules]({rules}) carefully." }
  - title: { ru: "Связь", en: "Contact" }
    items:
      - q: { ru: "Как связаться с организаторами?", en: "How do I reach the organisers?" }
        a: { ru: "После заявки мы общаемся по почте {email} или в Telegram {telegram}.", en: "After you apply, we stay in touch by email at {email} or on Telegram at {telegram}." }
      - q: { ru: "Как общаться с отелем?", en: "How do I deal with the hotel?" }
        a: { ru: "Если вы пользуетесь специальными условиями группы, общение с отелем идёт через организаторов ретрита.", en: "If you use the group’s special terms, all communication with the hotel goes through the retreat organisers." }
      - q: { ru: "Будет ли чат участников?", en: "Will there be a participants’ chat?" }
        a: { ru: "Да. После одобрения заявки и оплаты участия вас добавят в чат участников ретрита.", en: "Yes. Once your application is approved and paid, you’ll be added to the participants’ chat." }

# ----------------------------------------------------------------------------- финальный экран и подвал
final:
  kicker: { ru: "{dates} · Казбеги", en: "{dates} · Kazbegi" }
  title: { ru: "Глубокой и качественной *практики*", en: "Wishing you a deep and true *practice*" }
  text: { ru: "Количество мест ограничено — заполните заявку, и мы свяжемся с вами.", en: "Places are limited — fill in the application and we’ll get in touch." }
  photo: { src: "final.webp", m: "final-m.webp", pos: "50% 50%" }

footer:
  about: { ru: "Ретрит с Мастером Камильпашой в Rooms Kazbegi. {dates}, интенсив {intensive_dates}. Степанцминда, Грузия.", en: "Retreat with Master Kamilpasha at Rooms Kazbegi. {dates}, intensive {intensive_dates}. Stepantsminda, Georgia." }

# ----------------------------------------------------------------------------- анкета (apply.html)
#  Анкета 2027 без Google-формы. Имена полей, варианты (v), show_if и тексты согласий сверяются с form_schema.py
#  репозитория регистрации: python tools/check_form.py (код выхода 1 — расхождение). entry k27_<имя> — не Google: без entry apply.js прячет поле.
form:
  google_form: "https://t.me/Kazbegi_Retreat_bot"   # запасной путь на экране ошибки и без JavaScript (Google-форма 2026 закрыта)
  enabled: false               # false — анкету можно посмотреть, но заявки не отправляются (черновик). true — принимаем заявки
  endpoint: ""                 # адрес приёмника заявок (наш сервер). Пусто, пока приём не открыт
  draft_key: "retreat-apply-kazbegi-2027.1"   # черновики анкеты 2026 года не подтягиваются
  kicker: { ru: "Анкета участника", en: "Application" }
  title: { ru: "Заявка *на ретрит*", en: "Apply for *the retreat*" }
  meta: { ru: "{dates} · Rooms Kazbegi, Степанцминда, Грузия", en: "{dates} · Rooms Kazbegi, Stepantsminda, Georgia" }
  intro: { ru: "Пожалуйста, заполните анкету подробно. После этого команда организаторов свяжется с вами по почте или в Telegram.", en: "Please fill in the form as fully and thoughtfully as you can. The organising team will then contact you by email or Telegram." }
  photo: { src: "apply.webp", alt: { ru: "Горы Казбеги", en: "The Kazbegi mountains" } }
  presets:                     # общие варианты ответов
    yes_no: [{ v: "Да", ru: "Да", en: "Yes" }, { v: "Нет", ru: "Нет", en: "No" }]
    times: [{ v: "1" }, { v: "2" }, { v: "3" }, { v: "4" }, { v: "> 5", ru: "Больше 5", en: "More than 5" }]
  steps:
    - title: { ru: "Участие", en: "Participation" }
      intro: { ru: "Сначала — в чём вы хотите участвовать.", en: "First, what would you like to join?" }
      fields:
        - name: program
          entry: "k27_program"
          type: cards
          required: true
          label: { ru: "В чём вы хотите участвовать?", en: "What would you like to take part in?" }
          options:
            - { v: "Ретрит", ru: "Ретрит · {dates_short}", en: "Retreat · {dates_short}" }
            - { v: "Ретрит и интенсив", ru: "Ретрит и интенсив", en: "Retreat and intensive" }
            - { v: "Только интенсив", ru: "Только интенсив · {intensive_dates}", en: "Intensive only · {intensive_dates}" }
        - name: hasRetreat           # служебное: «да», если выбран ретрит (по нему показываются активности)
          entry: "k27_hasRetreat"
          type: derived
          from: program
          map: { "Ретрит": "да", "Ретрит и интенсив": "да" }
          default: "нет"
    - title: { ru: "Личные данные", en: "About you" }
      intro: { ru: "Как к вам обращаться и как с вами связаться.", en: "How to address you and how to reach you." }
      fields:
        - { name: fullname, entry: "k27_fullname", type: text, required: true, autocomplete: name, label: { ru: "Как вас зовут?", en: "What’s your name?" }, hint: { ru: "Имя и фамилия — как в загранпаспорте", en: "First and last name, exactly as in your passport" }, placeholder: { ru: "Имя Фамилия", en: "First name Last name" } }
        - { name: email, entry: "k27_email", type: email, required: true, autocomplete: email, label: { ru: "Электронная почта для связи", en: "Email" }, placeholder: { ru: "name@example.com", en: "name@example.com" } }
        - { name: telegram, entry: "k27_telegram", type: text, required: true, label: { ru: "Telegram для связи", en: "Telegram" }, hint: { ru: "Ник (например, @username) или номер телефона", en: "Username (e.g. @username) or phone number" }, placeholder: { ru: "@username", en: "@username" } }
        - { name: source, entry: "k27_source", type: textarea, required: true, label: { ru: "Откуда вы узнали о ретрите с Мастером?", en: "How did you hear about the retreat with the Master?" } }
        - { name: referrer, entry: "k27_referrer", type: text, label: { ru: "Кто вас позвал?", en: "Who invited you?" }, hint: { ru: "Если вас пригласил кто-то из участников — напишите имя. Можно оставить пустым", en: "If someone from the group invited you, write their name. You can leave this empty" } }
    - title: { ru: "Опыт практики", en: "Your practice" }
      intro: { ru: "Это поможет нам лучше подготовиться к встрече.", en: "This helps us prepare for meeting you." }
      fields:
        - { name: offline, entry: "k27_offline", type: radio, required: true, options: yes_no, label: { ru: "Есть ли у вас опыт очных ретритов с Мастером?", en: "Have you been to in-person retreats with the Master?" } }
        - { name: offlineTimes, entry: "k27_offlineTimes", type: radio, required: true, options: times, show_if: { name: offline, value: "Да" }, value_if_hidden: "Не участвовал", label: { ru: "Сколько раз?", en: "How many times?" } }
        - { name: online, entry: "k27_online", type: radio, required: true, options: yes_no, label: { ru: "А опыт онлайн-ретритов с Мастером?", en: "And online retreats with the Master?" } }
        - { name: onlineTimes, entry: "k27_onlineTimes", type: radio, required: true, options: times, show_if: { name: online, value: "Да" }, value_if_hidden: "Не участвовал", label: { ru: "Сколько раз?", en: "How many times?" } }
        - { name: regular, entry: "k27_regular", type: radio, required: true, options: yes_no, label: { ru: "Занимаетесь на регулярных встречах Мастера по понедельникам и четвергам?", en: "Do you attend the Master’s regular Monday and Thursday sessions?" } }
        - name: regularHowLong
          entry: "k27_regularHowLong"
          type: radio
          required: true
          show_if: { name: regular, value: "Да" }
          value_if_hidden: "Не участвую"
          label: { ru: "Как давно?", en: "For how long?" }
          options: [{ v: "1 месяц", en: "1 month" }, { v: "3 месяца", en: "3 months" }, { v: "6 месяцев", en: "6 months" }, { v: "Больше 1 года", en: "Over a year" }, { v: "Больше 3 лет", en: "Over 3 years" }]
        - { name: experience, entry: "k27_experience", type: textarea, label: { ru: "Опишите свой опыт медитативных практик", en: "Describe your meditation experience" }, hint: { ru: "Традиции, методы, сколько лет практикуете", en: "Traditions, methods, how long you have practised" } }
    - title: { ru: "Проживание", en: "Your stay" }
      intro: { ru: "Нужны точные даты заезда и выезда, даже если вы будете жить не в Rooms Kazbegi.", en: "We need exact arrival and departure dates, even if you stay outside Rooms Kazbegi." }
      fields:
        - { name: dates, entry: "k27_dates", type: dates, required: true, label: { ru: "Когда вы приедете и уедете?", en: "When will you arrive and leave?" }, hint: { ru: "Ретрит идёт {dates}, интенсив — {intensive_dates}. Официальные ночи ретрита — с {checkin} по {checkout}, после интенсива выезд {intensive_checkout}. Если вы едете только на интенсив — поменяйте даты", en: "The retreat runs {dates}, the intensive {intensive_dates}. The official retreat nights are {checkin} to {checkout}; after the intensive, check-out is on {intensive_checkout}. If you come for the intensive only, please change the dates" } }
        - { name: allDays, entry: "k27_allDays", type: radio, required: true, options: yes_no, label: { ru: "Будете все дни программы?", en: "Will you be there for the whole programme?" } }
        - { name: partialWhy, entry: "k27_partialWhy", type: textarea, show_if: { name: allDays, value: "Нет" }, label: { ru: "В какие дни вас не будет?", en: "Which days will you miss?" }, hint: { ru: "Мы очень рекомендуем быть всё время — практика складывается день за днём. Если не получается, напишите, когда приедете и уедете и почему", en: "We strongly recommend staying for the whole time — the practice builds day by day. If you can’t, tell us when you arrive and leave, and why" } }
        - name: stay
          entry: "k27_stay"
          type: radio
          required: true
          label: { ru: "Где вы будете жить?", en: "Where will you stay?" }
          hint: { ru: "Для группы ретрита в Rooms Kazbegi — специальный тариф, от {rooms_from} $ за номер за ночь", en: "Our group gets special rates at Rooms Kazbegi, from ${rooms_from} per room per night" }
          options:
            - { v: "Rooms, отдельный номер", ru: "Rooms, живу один / одна", en: "Rooms, a room of my own" }
            - { v: "Rooms, вдвоём — плачу я", ru: "Rooms, вдвоём — плачу за номер я", en: "Rooms, sharing — I pay for the room" }
            - { v: "Rooms, вдвоём — платит сосед", ru: "Rooms, вдвоём — за номер платит сосед", en: "Rooms, sharing — my roommate pays for the room" }
            - { v: "Rooms — бронирую напрямую в отеле", ru: "Rooms — бронирую сам(а) напрямую в отеле", en: "Rooms — I book directly with the hotel myself" }
            - { v: "Живу в другом месте", ru: "Живу в другом месте и прихожу на практики", en: "I stay elsewhere and come for the sessions" }
        - name: inBlock              # служебное: «да», если номер бронируют организаторы
          entry: "k27_inBlock"
          type: derived
          from: stay
          map: { "Rooms, отдельный номер": "да", "Rooms, вдвоём — плачу я": "да", "Rooms, вдвоём — платит сосед": "да" }
          default: "нет"
        - name: shared               # служебное: «да», если живёте вдвоём
          entry: "k27_shared"
          type: derived
          from: stay
          map: { "Rooms, вдвоём — плачу я": "да", "Rooms, вдвоём — платит сосед": "да" }
          default: "нет"
        - name: roomType
          entry: "k27_roomType"
          type: radio
          required: true
          show_if: { name: inBlock, value: "да" }
          label: { ru: "Какая категория номера?", en: "Which room category?" }
          options:
            - { v: "Standard King, вид на лес", en: "Standard King, forest view" }
            - { v: "Standard Twin, вид на лес", en: "Standard Twin, forest view" }
            - { v: "Standard King, вид на горы", en: "Standard King, mountain view" }
            - { v: "Executive King, вид на лес", en: "Executive King, forest view" }
            - { v: "Executive King, вид на горы", en: "Executive King, mountain view" }
            - { v: "Signature King, вид на лес", en: "Signature King, forest view" }
            - { v: "Signature King, вид на горы", en: "Signature King, mountain view" }
        - { name: roommateName, entry: "k27_roommateName", type: text, required: true, show_if: { name: shared, value: "да" }, label: { ru: "С кем вы будете жить?", en: "Who will you share with?" }, hint: { ru: "Имя и фамилия соседа — как в загранпаспорте. Если ещё не знаете с кем — напишите «пока не знаю»", en: "Your roommate’s first and last name, exactly as in their passport. If you don’t know yet, write “not yet”" } }
        - { name: extraBed, entry: "k27_extraBed", type: radio, options: yes_no, show_if: { name: inBlock, value: "да" }, label: { ru: "Нужна дополнительная кровать (10 $ за ночь плюс НДС 18%)?", en: "Do you need an extra bed ($10 per night plus 18% VAT)?" } }
        - { name: child, entry: "k27_child", type: textarea, show_if: { name: inBlock, value: "да" }, label: { ru: "Вы будете жить в Rooms с ребёнком?", en: "Will a child stay with you at Rooms?" }, hint: { ru: "Если да — сколько детей и сколько им лет. На практиках дети не присутствуют; присмотра организаторы не организуют", en: "If so, how many children and their ages. Children do not attend the sessions; the organisers do not provide childcare" } }
        - type: note
          text: { ru: "Номер в Rooms Kazbegi по групповому тарифу бронируют организаторы. Предоплата — 25 % ночей номера — вносится вместе с оплатой участия, гарантирует бронь у отеля; при отмене до 11.05.2027 включительно возвращается полностью, позже — нет; остальное вы платите отелю на месте. Счёт пришлём в письме после подтверждения заявки. К цене номера добавляется НДС 18%.", en: "The organisers book your room at Rooms Kazbegi at the group rate. A prepayment of 25% of the room’s nights is paid together with the retreat fee; it guarantees your booking with the hotel; if you cancel by 11 May 2027 inclusive it is refunded in full, later it is not. You pay the rest to the hotel on site. The invoice comes in the email after your application is confirmed. 18% VAT is added to the room price." }
    - title: { ru: "Активности и условия", en: "Activities & terms" }
      intro: { ru: "Последний шаг.", en: "The last step." }
      fields:
        - name: activities
          entry: "k27_activities"
          type: checkboxes
          show_if: { name: hasRetreat, value: "да" }
          label: { ru: "Какие совместные активности вам интересны?", en: "Which shared activities interest you?" }
          hint: { ru: "Их можно организовать заранее. Можно ничего не выбирать", en: "We can arrange them in advance. You can leave this empty" }
          options:
            - { v: "Поездка на внедорожниках к достопримечательностям", ru: "Поездка на внедорожниках к достопримечательностям", en: "Off-road trip to the sights" }
            - { v: "Конная прогулка по горам", ru: "Конная прогулка по горам", en: "Horse ride in the mountains" }
            - { v: "Хайкинг с проводником", ru: "Хайкинг с проводником", en: "Guided hike" }
            - { v: "Кулинарный мастеркласс", ru: "Кулинарный мастер-класс", en: "Cooking class" }
            - { v: "Прогулки по ближайшим деревням", ru: "Прогулки по ближайшим деревням", en: "Walks to nearby villages" }
            - { v: "Предложу свой вариант в чате", ru: "Предложу свой вариант в чате", en: "I’ll suggest my own in the chat" }
          other: { ru: "Другое", en: "Other" }
        - { name: propose, entry: "k27_propose", type: textarea, show_if: { name: hasRetreat, value: "да" }, label: { ru: "Хотите предложить или провести какую-то активность?", en: "Would you like to offer or lead an activity?" }, hint: { ru: "Коротко: что это и с чем нужна помощь", en: "Briefly: what it is and what help you need" } }
        - name: diet
          entry: "k27_diet"
          type: radio
          label: { ru: "Какое питание вам подходит?", en: "What food suits you?" }
          options:
            - { v: "Без ограничений", ru: "Без ограничений", en: "No restrictions" }
            - { v: "Вегетарианское", ru: "Вегетарианское", en: "Vegetarian" }
            - { v: "Веганское", ru: "Веганское", en: "Vegan" }
            - { v: "Другое", ru: "Другое — напишу ниже", en: "Other — I’ll write below" }
        - { name: dietNote, entry: "k27_dietNote", type: textarea, label: { ru: "Аллергии, непереносимости или другое питание", en: "Allergies, intolerances or other dietary needs" }, hint: { ru: "Если ничего — оставьте пустым", en: "If none, leave this empty" } }
        - { name: consent_terms, entry: "k27_consent_terms", type: consent, required: true, value: "Я ознакомлен(а) с Правилами участия 2027 и принимаю их", text: { ru: "Я ознакомлен(а) с [Правилами участия 2027]({rules}) и принимаю их", en: "I have read and accept the [2027 participation rules]({rules})" } }
        - name: consent_noshow
          entry: "k27_consent_noshow"
          type: consent
          required: true
          value: "Понимаю и согласен(на): если номер в Rooms бронируют для меня организаторы, отменить его можно только заменой имени гостя — иначе оплаченные ночи не возвращаются; при неявке или поздней отмене полную стоимость проживания по счёту отеля оплачиваю я."
          text:
            ru: "Понимаю и согласен(на): если номер в Rooms бронируют для меня организаторы, отменить его можно только заменой имени гостя — иначе оплаченные ночи не возвращаются; при неявке или поздней отмене полную стоимость проживания по счёту отеля оплачиваю я."
            en: "I understand and agree: if the organisers book a room at Rooms for me, it can only be cancelled by replacing the guest’s name — otherwise the paid nights are not refunded; for a no-show or a late cancellation I pay the full cost of the stay as invoiced by the hotel."
